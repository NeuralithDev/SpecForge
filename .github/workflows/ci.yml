name: SpecForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run Test Suites
        run: npx vitest run src/security/specforgeStudio.test.ts src/security/specforgeV3Features.test.ts src/security/specforgeV5Features.test.ts src/engine/BundlePackager.test.ts src/engine/Synthesizer.test.ts

      - name: Build Next.js Studio
        run: |
          cd apps/web
          npm run build
